name: Issue Dump
run-name: Dumping Issue Information
on: issues
jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Just print the body text
        run: echo "${ github.event.issue.body }"

